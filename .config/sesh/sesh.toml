# The tmux prefix-s picker (.tmux.conf) pipes `sesh list` into fzf, so the
# popup stays empty until the full list is produced. The zoxide source is the
# bottleneck: zoxide stats every database entry to filter out directories that
# no longer exist, and entries under /Volumes (SMB mounts) turn each of those
# stats into a network round trip. Listing time then depends on NAS latency:
# hundreds of milliseconds when it is awake, seconds when it is asleep or the
# mount is stale.
#
# The cache keeps only the zoxide and tmuxinator results. It serves them
# instantly and revalidates in the background (stale-while-revalidate, 5s TTL
# hardcoded upstream), moving the NAS round trips off the picker's critical
# path. tmux sessions are not cached: sesh lists them live on every call, so
# sessions created, renamed or killed outside sesh show up on the next list
# without tmux hooks or a refresh in the picker's ctrl-d binding.
#
# Listing tmux sessions live needs a sesh with joshmedeski/sesh#539. Until a
# release contains it, ~/go/bin/sesh is a local build of that branch from the
# fork checkout, which the PATH setup in .zprofile.d/050_go.sh prefers over
# the Homebrew bottle. A sesh without it caches tmux sessions as well, and the
# picker can then show stale sessions.
#
# Upstream documents the cache as experimental. To revert, remove
# `cache = true` and delete ~/.cache/sesh/sessions.v2.gob.
cache = true
