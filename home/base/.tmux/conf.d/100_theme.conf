# Custom Tmux Theme with Gruvbox Material Colors and Lualine Separators

# Color definitions from ghostty config
# Main colors
# BG="#1d2021"        # Background
BG="#32302F"        # Background
FG="#d4be98"        # Foreground
RED="#ea6962"       # Red
GREEN="#a9b665"     # Gree
YELLOW="#d8a657"    # Yellow
BLUE="#7daea3"      # Blue
MAGENTA="#d3869b"   # Magenta
CYAN="#89b482"      # Cyan
BLACK="#1d2021"     # Black
DARK_GRAY="#32302F"
LIGHT_GRAY="#4F4946"
TINT_RED="#4c3432"
TINT_BLUE="#374141"

# Greys for the status line while this tmux is switched off for a
# nested one (200_nested.conf). They sit one or two steps above BLACK, so
# that line steps back behind the nested tmux's own.
DIM_PILL="#2c2a29"
DIM_PILL_HI="#3a3735"
DIM_TEXT="#5a524c"
DIM_TEXT_HI="#665c54"

# Define the separators using printf for proper Unicode display
LEFT_SEP="#(printf '\ue0bc')"       # Full diagonal left separator
RIGHT_SEP="#(printf '\ue0ba')"      # Full diagonal right separator
THIN_LEFT_SEP="#(printf '\ue0bd')"  # Thin diagonal left separator
THIN_RIGHT_SEP="#(printf '\ue0bb')" # Thin diagonal right separator
THIN_VERTICAL_SEP="#(printf '\u23fd')"
# HALF_ROUND_OPEN="#(printf '\u25d6')"
# HALF_ROUND_CLOSE="#(printf '\u25d7')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
HALF_ROUND_OPEN="#(printf '\uE0B6')"
TRIANGLE_OPEN="#(printf '\ue0b2')"
TRIANGLE_CLOSE="#(printf '\ue0b0')"
# Marks a window that rang the bell. It must stay one cell wide, as it takes
# the place of a padding space in the window list.
ALERT_DOT="#(printf '\u25cf')"
# THIN_VERTICAL_SEP="#(printf '\u23ae')"

# Status bar styling
set-option -g status "on"
set-option -g status-style bg=$BG,fg=$FG
set-option -g status-interval 1

# Center the window list on the whole bar. Plain `centre` centres it in the
# space status-left and status-right leave free, so it would shift whenever
# the alert segment in status-left appears or grows.
set-option -g status-justify "absolute-centre"

# Set status left/right lengths
set-option -g status-left-length "100"
set-option -g status-right-length "100"

# Pane borders
set-option -g pane-border-style fg=$BLACK
set-option -g pane-active-border-style fg=$YELLOW

# Message and command styling
set-option -g message-style bg=$BG,fg=$YELLOW
set-option -g message-command-style bg=$BG,fg=$YELLOW

# Popups (sesh, fzf-tmux) take the terminal's own colours. The programs in
# them pick their colours for the terminal background, and tmux's built-in
# popup style fills the popup with a theme grey that depends on the detected
# light or dark terminal theme.
set-option -g popup-style bg=default,fg=default
set-option -g popup-border-style fg=$LIGHT_GRAY

# Copy mode selection and highlighted items in choose-tree and similar modes
set-option -g mode-style bg=$YELLOW,fg=$BG

# Pane number display colors
set-option -g display-panes-active-colour $YELLOW
set-option -g display-panes-colour $BLUE

# Window status styling
# set-window-option -g window-status-style bg=$BG,fg=$FG
# set-window-option -g window-status-current-style bg=$YELLOW,fg=$BG
# set-window-option -g window-status-activity-style bg=$BG,fg=$RED
# set-window-option -g window-status-bell-style bg=$RED,fg=$BG

# Status bar left (session name, alerts from other sessions)
#
# A bell in a session you are not attached to never reaches its window list,
# so the names of all other sessions with an alert appear in a red segment
# after the session name. The segment is absent while there are none, and the
# session name then closes with its usual arrow. The current session is left
# out by the empty second format of `#{S:...}`, as its own window list shows
# the alert.
#
# The names are joined by regex substitution, since a session loop cannot
# tell which matching session comes first: every name gets a leading space,
# the first one is stripped, and the remaining ones become ` · `. A session
# name containing a space would be split by it.
#
# Each style attribute inside the conditional gets its own `#[...]`, which
# avoids escaping commas.
ALERT_ANY="#{S:#{?session_alerts,1,},}"
ALERT_NAMES="#{s/ / · /:#{s/^ //:#{S:#{?session_alerts, #{session_name},},}}}"
ALERT_SEGMENT="#[bg=$TINT_RED]#[fg=$LIGHT_GRAY]${TRIANGLE_CLOSE}#[fg=$RED]#[noitalics] ${ALERT_NAMES} #[bg=$BG]#[fg=$TINT_RED]#[nobold]${TRIANGLE_CLOSE}"
set-option -g status-left "#[bg=default,fg=$LIGHT_GRAY]${HALF_ROUND_OPEN}#[bg=$LIGHT_GRAY,fg=$YELLOW,bold,italics]#S #{?${ALERT_ANY},${ALERT_SEGMENT},#[bg=$BG]#[fg=$LIGHT_GRAY]${TRIANGLE_CLOSE}}"

# Status bar right (hostname, nested tag)
#
# A tmux running inside another tmux puts a blue tag with a layers icon
# in front of the host name, built like the alert segment on the left.
# It notices that from its client's terminal: a client in a tmux pane
# reports the outer tmux's default-terminal, tmux-256color, while Ghostty
# reports xterm-ghostty. The tag shows whenever this tmux runs nested,
# whatever state the outer tmux is in.
NESTED="#{m:tmux*,#{client_termname}}"
NESTED_SEGMENT="#[bg=$BG]#[fg=$TINT_BLUE]${TRIANGLE_OPEN}#[bg=$TINT_BLUE]#[fg=$BLUE] \U000F0328 #[fg=$LIGHT_GRAY]${TRIANGLE_OPEN}"
set-option -g status-right "#{?${NESTED},${NESTED_SEGMENT},#[bg=$BG]#[fg=$LIGHT_GRAY]${TRIANGLE_OPEN}}#[bg=$LIGHT_GRAY,fg=$CYAN,bold,italics] #h#[bg=default,fg=$LIGHT_GRAY]${HALF_ROUND_CLOSE}"

# tmux's default alert style is `reverse`, which inverts the explicit colours
# in the formats below. Alerts are drawn by the format itself instead.
set-window-option -g window-status-bell-style default
set-window-option -g window-status-activity-style default

# Window status format (for inactive windows)
#
# A bell replaces the leading padding space with a red dot, so the
# entry keeps the width of both the normal and the current-window format and
# the centred list never shifts. Commas inside the conditional branches are
# escaped as `#,`. The current-window format needs no bell branch because
# tmux never flags the window you are in.
set-window-option -g window-status-format "#[bg=$BG]#{?window_bell_flag,#[fg=$RED#,bold]${ALERT_DOT},#[fg=$FG] }#I#[fg=$MAGENTA]:#{?window_bell_flag,#[fg=$RED],#[fg=$FG]}#W "

# Current window status format (for active window)
# set-window-option -g window-status-current-format "#[fg=$BG,bg=$YELLOW]${LEFT_SEP}#[fg=$BG,bg=$YELLOW,bold] #I ${THIN_RIGHT_SEP} #W #[fg=$BG,bg=$YELLOW]${RIGHT_SEP}"
set-window-option -g window-status-current-format "#[fg=$YELLOW,bg=$BG]${HALF_ROUND_OPEN}#[bg=$YELLOW,fg=$BG]#I#[fg=$RED]:#[fg=$BG]#W#[fg=$YELLOW,bg=$BG]${HALF_ROUND_CLOSE}"

# The format above draws all colours of the current window itself. Any
# attribute in this style, such as tmux's default `underscore`, would be
# drawn on top of it.
set-window-option -g window-status-current-style default

# Window separator (space between window statuses)
set-window-option -g window-status-separator ""

# Status line while switched off for a nested tmux (200_nested.conf)
#
# The bar takes the window background and keeps the session and host
# pills in dark greys, so the nested tmux's line above reads as the one
# in charge. The middle stays empty, as the eye looks there for the
# window list, which is now the nested one's. The state hangs off the
# session pill and the key that brings this tmux back sits in front of
# the host pill, both built like the alert segment.
#
# `hidden` instead of `dim` removes the line while switched off.
set-option -g @nested-suspend-style "dim"
set-option -g @nested-suspended-format "\
#[fill=$BLACK]#[align=left]#[bg=default,fg=$DIM_PILL_HI]${HALF_ROUND_OPEN}#[bg=$DIM_PILL_HI,fg=$DIM_TEXT_HI,bold,italics]#S #[bg=$DIM_PILL,fg=$DIM_PILL_HI,nobold,noitalics]${TRIANGLE_CLOSE}#[bg=$DIM_PILL,fg=$DIM_TEXT] suspended #[bg=$BLACK,fg=$DIM_PILL]${TRIANGLE_CLOSE}\
#[align=right]#[bg=$BLACK,fg=$DIM_PILL]${TRIANGLE_OPEN}#[bg=$DIM_PILL,fg=$DIM_TEXT] ctrl+esc #[bg=$DIM_PILL,fg=$DIM_PILL_HI]${TRIANGLE_OPEN}#[bg=$DIM_PILL_HI,fg=$DIM_TEXT_HI,bold,italics] #h#[bg=default,fg=$DIM_PILL_HI,nobold,noitalics]${HALF_ROUND_CLOSE}"
