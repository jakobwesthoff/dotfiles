# What tmux may use of the terminal it runs in, and what it passes on.

# Enable RGB colour for outer terminals
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -s extended-keys on
set-option -g focus-events on

# Pass escape sequences (Kitty images, OSC notifications) through to
# Ghostty. `all` instead of `on` also forwards them from panes that are
# not visible: a TUI sends a Kitty image only once, so a transfer dropped
# while its window is in the background never shows up afterwards.
set -g allow-passthrough all

# Avoid ESC delay
set -s escape-time 0

# Use OSC 52 for clipboard so copies work both locally and over SSH.
# tmux emits the OSC 52 sequence to the outer terminal (Ghostty), which sets
# the macOS clipboard. Over SSH, the sequence travels through the connection
# to whatever terminal the SSH client is running, so the correct clipboard
# is always targeted. This also removes the pbcopy dependency entirely.
set -s set-clipboard on
