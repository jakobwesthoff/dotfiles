# Switch this tmux off and on again with Ctrl+Esc, for working in a tmux
# nested inside it, such as one on a server reached by ssh from a pane.
#
# Switched off, the session has no prefix and an empty key table, so
# every key reaches the program in the pane, the inner tmux included.
# Its status line either disappears or is replaced by a quiet one,
# depending on @nested-suspend-style. Ctrl+Esc switches it back on.
#
# Both sides load this same file. That works because the outer tmux
# always sees Ctrl+Esc first and swallows it, in both states; the inner
# tmux never receives it. On a host without an outer tmux, Ctrl+Esc
# switches that host's tmux off and on.
#
# Options, set before this module loads (the theme sets both):
#
#   @nested-suspend-style      `hidden` removes the status line while
#                            switched off; anything else shows
#                            @nested-suspended-format instead.
#   @nested-suspended-format   status line format while switched off.
#                            Without it the line says "suspended".

# ---------------------------------------------------------
# The key
# ---------------------------------------------------------
#
# A terminal has no standard encoding for Ctrl+Esc. Ghostty therefore
# sends a sequence of its own for it, which no program assigns to
# anything, and tmux maps that sequence to its spare key User0. The
# Ghostty side is this line in ~/.config/ghostty/config:
#
#   keybind = ctrl+escape=esc:[99~
#
# Another terminal needs the same mapping to use the toggle; without it
# Ctrl+Esc arrives as a plain Escape and does nothing here.
set -s user-keys[0] "\e[99~"

# ---------------------------------------------------------
# Switching off and on
# ---------------------------------------------------------
#
# Everything is set on the session, not globally, so only the session
# the key was pressed in switches off. `set -u` drops the session value
# again and the global one from the other modules applies.
#
# Copy mode is left first: its key table would otherwise keep catching
# keys meant for the inner tmux.
bind -T root User0 {
  if -F '#{pane_in_mode}' { send-keys -X cancel }
  set prefix None
  set prefix2 None
  set key-table nested-off
  if -F '#{==:#{@nested-suspend-style},hidden}' {
    set status off
  } {
    set status-format[0] '#{?@nested-suspended-format,#{E:@nested-suspended-format},#[align=centre]suspended}'
  }
}

bind -T nested-off User0 {
  set -u prefix
  set -u prefix2
  set -u key-table
  set -u status
  set -u status-format
}
